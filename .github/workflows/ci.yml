name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

      - name: Run LlamaIndex integration tests (real llama-index-core)
        run: >
          uv run --no-project --python ${{ matrix.python-version }}
          --with . --with "llama-index-core>=0.12"
          --with pytest==8.0 --with pytest-asyncio
          pytest -v tests/test_llamaindex_integration.py
